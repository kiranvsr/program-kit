# Commands the program runs. Each of build, test, scan, compile_check and extra_gate is a list of
# commands, and each command is an argv list: the program, then its arguments, one entry per line.
# For example, `go test ./...` is written
#
#   test:
#     - - go
#       - test
#       - ./...
#
# build, test and scan must each list at least one command before `pk doctor` passes.
build: []
# The fast default suite that finishes in minutes; slow cases sit behind one environment variable and run in release-set tracks (rule W12, pk fingerprint).
test: []
scan: []
compile_check: []
extra_gate: []
# true runs test, scan and extra_gate concurrently; keep false unless those commands can share one tree at once.
parallel_steps: false
# Files that only the controller may change. An entry is an exact path, or a directory when it ends
# in a slash (everything under it is guarded). A task branch may change one only if its SPEC on main has
# a line `Guarded edit: <path>`.
guarded_files:
  - program/checks.yaml
  - program/release-set.yaml
# Verification tiers (kit/rules/RULES.md, part 4). While full_paths is empty every task is full-tier.
# full_paths: the paths that are always full-tier in this program (access control, tenancy, data migrations,
# cryptography, release); a standard or light task that changes one fails the gate. The kit's own gates
# (kit/, program/checks.yaml, program/gates.yaml) are always full-tier and need no entry.
# light_paths and light_ruling switch the light tier on: the ruling (R<n> in program/rulings.md) names the
# kinds of change it covers, light_paths says where they live. An entry is a path and covers everything under
# it: write a directory with its trailing slash (`auth/`); `auth` guards the same. `pk doctor` warns about an
# entry that covers no tracked file.
# An entry may also be a glob (0.5.5): `*` stays within one directory, `**` crosses them, and a glob covers
# what it matches and everything under a directory it matches. The UI fast lane (playbook 07, step 10) is the
# light tier on the stylesheets and static site assets, switched on by a ruling of the user's; for example:
#
#   tiers:
#     full_paths:
#       - src/auth/
#     light_paths:
#       - docs/
#       - web/src/**/*.css
#       - web/public/site/
#     light_ruling: R12
tiers:
  full_paths: []
  light_paths: []
  light_ruling: ""
# Optional, read by `pk drift` only: the program's own generators, which must leave the tree as committed, and
# a glob of migration files that a document must each name. For example:
#
#   drift:
#     regenerate:
#       - - python3
#         - tools/gen_docs.py
#     docs_vs_migrations:
#       glob: db/migrations/*.sql
#       doc: docs/DATABASE.md
# Optional (0.5.2), speeds up the evidence step; absent, everything runs one at a time as before:
#
#   evidence:
#     plant_workers: 4            # planted-bug rows judged at once, each in its own mirror; rows marked
#                                 # serial: true (browser, e2e, fixed port) run alone after the pool
#     reuse_unchanged_code: true  # the hand-back gate reuses the latest record when the code is byte-identical
#     reuse_ignore:               # paths outside program/ that are not code (never kit/ or a lockfile)
#       - docs/
#     reuse_compare:              # paths under program/ the producer reads, compared like code
#       - program/tools/
#     step_timeout: 7200          # (0.5.5) produce.py's limit in seconds, at least 3600; absent, the gate scales
#                                 # it from the last record's planted-bug rows, timing and this run's workers
#     plan_reuse_test: true       # (0.6.0) a PLAN command identical to a test command takes the test step's
#                                 # result in the hand-back gate instead of running again (default false)
#     plant_row_seconds: 110      # (0.6.0) one row slot of pk gate plants --chunk-seconds when no plants or
#                                 # results record measured it yet; absent, 120
# Optional (0.6.0): files that merge as a union of both sides' lines when a task branch and main both changed
# them (append-only lists, such as a migrations journal each side added an entry to). An entry is a path, a
# directory or a glob, as for tiers. pk merge, the gates' trial merge, pk merge check and the late-work rule
# resolve such a conflict alike; a .json file whose union does not parse stays a conflict. Absent, none does:
#
#   merge:
#     union_files:
#       - db/migrations/journal.txt
# Optional (0.6.0), read by `pk remote` only: heavy steps on lanes of another machine, over plain ssh, git and tar.
# The ssh destination is never in this file: export it in the variable host_env names (default PK_REMOTE_HOST).
# On the remote, <dir>/repo.git is a bare mirror the runner pushes main and the task branch to (only there, never to
# origin) and each lane, <dir>/<lane>, is a clone of it with its own `pk lock`. setup runs in the lane's task
# worktree before the step (an offline dependency install, say), lane_wrap and wrap prefix the step's argv, env is
# exported on the lane (PK_LOCK_NAME there shares a lock the lanes' own scripts already take), and workers sets
# PK_PLANT_WORKERS. Then `pk remote status`, `pk remote gate <ID>`, `pk remote plants <ID> --all-pending
# --chunk-seconds N` (add `--plan` to see the chunks; start `--chunk K/M` runs at once, each takes a free lane) and
# `pk remote run <owner> -- <command>` (the current worktree, uncommitted changes included). Commit the evidence that
# comes back on the task branch as after a local run. For example:
#
#   remote:
#     dir: lanes
#     lanes:
#       - lane1
#       - lane2
#     setup:
#       - - make
#         - deps
#     env:
#       PK_LOCK_NAME: pk-heavy
#     wrap:
#       - nice
#       - "-n"
#       - "5"
#     lane_wrap:
#       lane1:
#         - taskset
#         - "-c"
#         - 0-5
#     workers: 3
