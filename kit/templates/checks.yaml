# Commands the program runs. Each of build, test, scan, compile_check and extra_gate is a list of
# commands, and each command is an argv list: the program, then its arguments, one entry per line.
# For example, `go test ./...` is written
#
#   test:
#     - - go
#       - test
#       - ./...
#
# build, test and scan must each list at least one command before `pk doctor` passes.
build: []
test: []
scan: []
compile_check: []
extra_gate: []
# Files that only the controller may change. An entry is an exact path, or a directory when it ends
# in a slash (everything under it is guarded). A task branch may change one only if its SPEC on main has
# a line `Guarded edit: <path>`.
guarded_files:
  - program/checks.yaml
