# Gates: the claims a phase makes and the records that prove them. Each gate needs at least one
# record from stage 4. One entry per gate, keyed by ID G-<NAME>. claims say what the gate asserts
# is true, environment names an entry in environments.yaml, and each record names the task whose latest
# results and acceptance records prove it (task: <ID>) and what accepting it means.
#
#   G-P0:
#     title: Phase 0 exit
#     claims:
#       - Sign-up works end to end
#     environment: dev
#     records:
#       - task: G-P0
#         acceptance: All checks pass
gates: {}
