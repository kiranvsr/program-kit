# Commands the gate runs, as argv lists (never a shell). build, test and scan must each list a command.
build:
  - - python3
    - '-m'
    - compileall
    - '-q'
    - .
# The fast default suite that finishes in minutes; slow cases sit behind one environment variable and run in release-set tracks (rule W12, pk fingerprint).
test:
  - - python3
    - '-m'
    - unittest
    - discover
scan:
  - - python3
    - '-m'
    - pip
    - check
  - - gitleaks
    - detect
    - '--no-git'
compile_check: []
extra_gate: []
# true runs test, scan and extra_gate concurrently; keep false unless those commands can share one tree at once.
parallel_steps: false
guarded_files:
  - pyproject.toml
  - requirements.txt
  - program/checks.yaml
  - program/release-set.yaml
# Verification tiers (kit/rules/RULES.md, part 4). While full_paths is empty every task is full-tier.
# full_paths: the paths that are always full-tier in this program (access control, tenancy, data migrations,
# cryptography, release); a standard or light task that changes one fails the gate. The kit's own gates
# (kit/, program/checks.yaml, program/gates.yaml) are always full-tier and need no entry.
# light_paths and light_ruling switch the light tier on: the ruling (R<n> in program/rulings.md) names the
# kinds of change it covers, light_paths says where they live. An entry is an exact path, or a directory
# when it ends in a slash.
tiers:
  full_paths: []
  light_paths: []
  light_ruling: ""
