# Commands the gate runs, as argv lists (never a shell). build, test and scan must each list a command.
build:
  - - python3
    - '-m'
    - compileall
    - '-q'
    - .
test:
  - - python3
    - '-m'
    - unittest
    - discover
scan:
  - - python3
    - '-m'
    - pip
    - check
  - - gitleaks
    - detect
    - '--no-git'
compile_check: []
extra_gate: []
guarded_files:
  - pyproject.toml
  - requirements.txt
  - program/checks.yaml
